[package]
name = "warden-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "warden-server"
path = "src/main.rs"

[dependencies]
# The `/arca/v1/` routes (`arca_api.rs`): the contract served by `arca_core::server`, without arca's HTTP client (its `hub` feature,
# which is not needed to serve). Pinned by commit; moving the `rev` is a decision each time arca changes.
arca-core = { git = "https://github.com/Arven-Labs/arca", rev = "e56019271b8bd79912a4adaacbf221302f57a47b", default-features = false }
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
clap = { version = "4", features = ["derive", "env"] }
dirs.workspace = true
futures-util = "0.3"
# Request-head parsing for the web UI (P78) — already in the tree via tungstenite.
httparse = "1"
# `ring` picked explicitly, same reason as warden-server-protocol's `src/tls.rs`.
# `web/dist` compiled into the binary (P78); `allow_missing` so a checkout without an npm build still compiles.
rust-embed = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# P105: the HMAC of a signed webhook call (`webhook_signature.rs`). 0.12 pairs with sha2 0.10.
hmac = "0.12"
tokio ={ workspace = true, features = ["sync"] }
# `CancellationToken`: the Stop button ends an ordinary turn where it is (`Orchestrator::with_stop`).
tokio-util = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.30"
# P84 slice 4: the members' file in a backup (`member_backup.rs`).
toml.workspace = true
# P143 (d): the hub's diagnostics (`logging.rs`) — levels, time and fields instead of bare `eprintln!`.
tracing.workspace = true
warden-bootstrap = { path = "../warden-bootstrap" }
warden-truthid = { path = "../warden-truthid" }
warden-core = { path = "../warden-core" }
warden-server-protocol = { path = "../warden-server-protocol" }

[dev-dependencies]
# The client of the arca pairing routes, proven against the real hub (tests/arca_pairing_client.rs).
warden-sync = { path = "../warden-sync", features = ["arca"] }
# The arca client (`HubStore`) and `Engine`, to prove the real hub speaks what they expect (tests/arca_api.rs).
arca-core = { git = "https://github.com/Arven-Labs/arca", rev = "e56019271b8bd79912a4adaacbf221302f57a47b", features = ["hub"] }
k256 = { version = "0.14", features = ["ecdsa"] }
# Throwaway CA + leaf certs for the TLS tests (tests/tls.rs) — `ring` backend, same as rustls here.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# The stand-in authorization server of the MCP sign-in tests (`mcp_login.rs`), the same shape as warden-core's tests/mcp_oauth.rs.
axum = "0.8"
reqwest.workspace = true
