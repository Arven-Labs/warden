[package]
name = "warden-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "warden"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs.workspace = true
owo-colors = "4"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
tokio = { workspace = true, features = ["sync"] }
unicode-width = "0.2"
qrcode = "0.14"
# `arca`: `/arca sync` talks to a hub with the arca's HTTP client, whose TLS provider is `aws-lc-rs` (C code), the same as the
# desktop and `warden-server` already build. The CLI has no mobile build, so it is on without a switch of its own.
warden-bootstrap = { path = "../warden-bootstrap", features = ["arca"] }
warden-core = { path = "../warden-core" }
warden-sync = { path = "../warden-sync", features = ["arca"] }

[dev-dependencies]
serde_json.workspace = true
