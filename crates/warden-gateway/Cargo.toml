[package]
name = "warden-gateway"
version.workspace = true
edition.workspace = true

[[bin]]
name = "warden-gateway"
path = "src/main.rs"

# The hosted model gateway (HOSPEDAGEM.md phase 2): an OpenAI-compatible endpoint that charges prepaid credits for each
# call. `store` is the durable ledger (SQLite, money as integer micro-USD), `catalog` the models and their cost and sale
# prices, `flow` the reserve, call and settle steps behind a trait (`Upstream`), `http` the endpoint and `quota` the caps.
# It doesn't depend on `warden-core` or `warden-bootstrap`: an instance reaches it as a plain `Provider::Cloud`.
[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
# The endpoint is hand-written over a TCP stream, like `warden-server`'s Warden API (no web framework).
httparse = "1"
rand = "0.8"
reqwest.workspace = true
# `bundled` compiles SQLite from source, so nothing has to be installed on the host (Linux, Windows and the image alike).
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
warden-hosted-protocol = { path = "../warden-hosted-protocol" }
