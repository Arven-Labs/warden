[package]
name = "warden-sync"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
reqwest.workspace = true
url = "2"
base64.workspace = true
dirs.workspace = true
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
futures-util = "0.3"
tokio-tungstenite = "0.30"
# Glob matching for `.syncignore` (P75) — same crate ripgrep uses for `.gitignore`-style patterns;
# deliberately not the full `ignore` crate (pulls in `walkdir` and a directory-walking API this
# crate doesn't need — `Vault::list_all_files` already does the walking).
globset = "0.4"
# `default-features = false` — warden-sync only uses `Vault` for file I/O (list/read/write), never
# `Orchestrator`/chat, so it doesn't need `semantic-search` (fastembed/ort) at all. Critically, this
# keeps `ort` — which has no prebuilt binary for `armv7-linux-androideabi` — out of
# `warden-mobile-bridge`'s Android cross-compile (it depends on warden-core only through this crate).
warden-core = { path = "../warden-core", default-features = false }
warden-truthid = { path = "../warden-truthid" }
# The arca sync cycle (`arca_sync.rs`), off by default: arca's `hub` feature pulls `reqwest` with the `aws-lc-rs` TLS provider
# (C code), and `warden-mobile-bridge` (Android) pins `ring`. The on/off switch itself (`arca_mode.rs`) has no such dependency, so
# a build without this feature still refuses to write a vault that is in arca mode. Pinned by commit, like in `warden-server`.
arca-core = { git = "https://github.com/Arven-Labs/arca", rev = "e56019271b8bd79912a4adaacbf221302f57a47b", optional = true, features = ["hub"] }

[features]
arca = ["dep:arca-core"]

[dev-dependencies]
axum = "0.8"
