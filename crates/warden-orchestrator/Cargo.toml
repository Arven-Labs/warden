[package]
name = "warden-orchestrator"
version.workspace = true
edition.workspace = true

[[bin]]
name = "warden-orchestrator"
path = "src/main.rs"

# The hosted-instances orchestrator (P138, HOSPEDAGEM.md phase 4): the policy that decides when an idle, heavy instance is
# recycled (K.6 item 5), and what acts on it, one container per customer through the `docker` CLI. The Docker and the
# HTTP sides sit behind traits (`ContainerRuntime`, `StatusSource`), so the rest is testable with fakes. It doesn't depend
# on `warden-bootstrap` or `warden-core`: it only needs the status type the hub answers with.
[dependencies]
# Backups are encrypted as a stream (`backup.rs`). The same `aes-gcm` the rest of the workspace uses, plus its `stream` feature.
aes-gcm = { version = "0.10", features = ["stream"] }
anyhow.workspace = true
async-trait.workspace = true
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
warden-server-protocol = { path = "../warden-server-protocol" }
