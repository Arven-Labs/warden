name: Windows (does it compile?)

# Compiles the whole workspace for Windows, testing nothing (P152): the `v0.1.0` tag was the first time anything compiled there,
# and the compiler stopped at the first crate that failed. `--keep-going` lists every crate that breaks at once, without spending
# a tag (which would also republish the hub image). By hand only:
#   gh workflow run windows-check.yml
# `cargo check` does not prove the `.msi` comes out (Tauri's packaging only runs in `build.yml`), only that it compiles.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: cargo check on Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # Like `ci.yml` on Linux: the whole workspace, with the tests, and all the errors at once.
      - name: cargo check
        run: cargo check --workspace --all-targets --locked --keep-going
