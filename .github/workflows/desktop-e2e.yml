name: Desktop E2E

# The desktop-only screens (Publish a skill, the Gallery, the Sync QR) and the chat, photographed in a headless browser over `desktop/dist`,
# with a fake backend in place of Tauri (`desktop/e2e/harness.mjs`) and made-up data. It proves the screen and what it asks of the backend, not
# the Rust behind it. CI always uploads the photos, for someone to look at each one (`project/AUTOMACAO.md`). It does not compile Rust: only `tsc` and `vite`.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '!desktop/src-tauri/**'
      - '.github/workflows/desktop-e2e.yml'
  workflow_dispatch:

concurrency:
  group: desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Desktop screens in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci
        working-directory: desktop
        run: npm ci

      - name: Build the page
        working-directory: desktop
        run: npm run build

      - name: Chromium
        working-directory: desktop
        run: npx playwright-core install --with-deps chromium

      # A test that hangs fails by itself in 4 minutes and the whole step in 10, instead of the run sitting still with no log.
      - name: Browser tests
        working-directory: desktop
        timeout-minutes: 10
        env:
          WARDEN_E2E_SCREENS: ${{ github.workspace }}/e2e-screens
        run: node --test --test-reporter=tap --test-timeout=240000 e2e/*.test.mjs

      # Always, not only on failure: the photos are meant to be looked at even when everything is green.
      - name: Screen photos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-screens
          path: e2e-screens
          retention-days: 14
          if-no-files-found: ignore
