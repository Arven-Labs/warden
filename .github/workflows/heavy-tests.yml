name: Heavy tests

# The `#[ignore]` tests that download the real embedding models (~120 MB each) and run the semantic
# search: the "test round" that used to stay pending on the machine (Session 223). Manual only:
#   gh workflow run heavy-tests.yml
# The `opencode` test (`code_engine/process.rs`) stays out, since it needs the program installed.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  embeddings:
    name: Embedding models (vault and history)
    # 24.04: the ready-made ONNX Runtime of `ort` needs glibc 2.38+ (see ci.yml).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # Where warden-core's `model_cache_dir()` keeps the downloaded models.
      - name: Models cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/warden/models
          key: warden-models-${{ hashFiles('crates/warden-core/Cargo.toml') }}

      - name: Tests with the real model
        run: cargo test -p warden-core --test semantic_search --test history_embed -- --ignored --nocapture

      # P156: how much memory the history model gives back when unloaded, with glibc's default arenas and with a single one.
      - name: History model memory on unload
        run: |
          cargo test -p warden-core --test history_embed_memory -- --ignored --nocapture
          MALLOC_ARENA_MAX=1 cargo test -p warden-core --test history_embed_memory -- --ignored --nocapture
