name: CI

# The full suite runs here, not on the development machine (Session 223): on the machine only `cargo check`
# and a one-off test stay. It runs on every push to main, on PRs and from the "Run workflow" button.
# A commit that only touches the documentation does not trigger the run, and each job only runs if its area changed (job `changes`):
#   rust       <- crates/**, community/** (the first source's index is checked by a test), desktop/src-tauri/**, Cargo.toml, Cargo.lock
#   web        <- web/**
#   desktop    <- desktop/**
#   extension  <- extension/**
#   site       <- site/** and GUIA-DE-USO.md (the docs test compares its config example with the guide's)
#   mobile     <- mobile/**, crates/warden-mobile-bridge/** (the Dart generated by flutter_rust_bridge comes out of that crate), the crates it
#                 depends on (warden-core, warden-server-protocol, warden-sync, warden-truthid) and Cargo.lock
#   android    <- the same filter as mobile (builds the arm64 APK, which `mobile` does not)
# Touching ci.yml itself runs everything, and so does the "Run workflow" button.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - 'project/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental only helps whoever recompiles the same tree; in CI it only fattens the cache.
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.out.outputs.rust }}
      mobile: ${{ steps.out.outputs.mobile }}
      # JSON list of the changed frontends, used as a matrix (`[]` = none).
      frontends: ${{ steps.out.outputs.frontends }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter by folder
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'community/**'
              - 'desktop/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            desktop:
              - 'desktop/**'
              - '.github/workflows/ci.yml'
            extension:
              - 'extension/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - 'crates/warden-mobile-bridge/**'
              # What the bridge compiles into the app (its path dependencies, and theirs): a change in one of them can break the
              # Android build without touching mobile/ (the `ring` that came in with the package signatures, Session 309).
              - 'crates/warden-core/**'
              - 'crates/warden-server-protocol/**'
              - 'crates/warden-sync/**'
              - 'crates/warden-truthid/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            site:
              - 'site/**'
              - 'GUIA-DE-USO.md'
              - '.github/workflows/ci.yml'

      - name: Result
        id: out
        env:
          EVENT: ${{ github.event_name }}
          MATCHED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MATCHED='["rust","web","desktop","extension","mobile","site"]'
          fi
          echo "rust=$(jq -r 'index("rust") != null' <<<"$MATCHED")" >> "$GITHUB_OUTPUT"
          echo "mobile=$(jq -r 'index("mobile") != null' <<<"$MATCHED")" >> "$GITHUB_OUTPUT"
          echo "frontends=$(jq -c '[.[] | select(IN("web","desktop","extension","site"))]' <<<"$MATCHED")" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (clippy and tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # 24.04 and not 22.04: the ready-made ONNX Runtime that `ort` downloads needs glibc 2.38+ (22.04 has 2.35 and the link fails).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # `desktop/src-tauri` is a workspace member, so Linux needs the same libs as build.yml.
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            patchelf \
            libudev-dev \
            libasound2-dev \
            pkg-config

      # No `cargo fmt --check`: the repo does not follow rustfmt.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        # Without stopping at the first crate that fails, so the run shows all the failures at once. The output also goes to a file, for the
        # next step to list in the run summary what failed (P164 b); `pipefail` (from `shell: bash`) keeps the status of `cargo test`.
        shell: bash
        run: |
          # DIAGNOSTIC (throwaway PR, never merge): each test binary runs on its own with `timeout -s KILL`, no pipe, so a hung test
          # cannot hold the step. On a hang, the thread names (libtest names each test thread after the test) are listed first.
          set +e
          mkdir -p diag
          cargo test --workspace --no-run --message-format=json 2>diag/build.log \
            | jq -r 'select(.reason=="compiler-artifact" and .profile.test==true and .executable!=null) | ((.manifest_path | sub("/Cargo.toml$"; "")) + " " + .executable)' | sort -u > diag/bins.txt
          wc -l diag/bins.txt
          {
            echo "## Test binaries"
            echo
            echo "| binary | exit | seconds |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          root=$PWD
          while read -r dir bin; do
            name=$(basename "$bin")
            start=$(date +%s)
            # Like cargo: working directory and CARGO_MANIFEST_DIR of the crate that owns the binary.
            (cd "$dir" && CARGO_MANIFEST_DIR="$dir" exec "$bin") >"$root/diag/$name.log" 2>&1 &
            pid=$!
            code=
            for _ in $(seq 1 300); do
              if ! kill -0 "$pid" 2>/dev/null; then wait "$pid"; code=$?; break; fi
              sleep 1
            done
            if [ -z "$code" ]; then
              {
                echo "HUNG: $name (pid $pid)"
                for t in /proc/$pid/task/*; do echo "$(cat "$t/comm") | $(cat "$t/wchan" 2>/dev/null)"; done
              } | tee "diag/$name.hung.txt"
              kill -9 "$pid"; wait "$pid" 2>/dev/null
              code=HUNG
            fi
            echo "| $name | $code | $(( $(date +%s) - start )) |" >> "$GITHUB_STEP_SUMMARY"
          done < diag/bins.txt
          timeout -s KILL 300 cargo test --doc --workspace >diag/doc.log 2>&1
          echo "| doctests | $? | - |" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: diag/

  frontends:
    name: Frontend (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.frontends != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.frontends) }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          # The same as the development machine: the tests import `.ts` directly and `node --test tests/` receives a
          # folder, and Node 24 does not accept a folder there.
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Flutter analyze and tests)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The same version as the development machine.
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Style notices (info) do not bring the run down; errors and warnings do.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # The tests do not load the Rust library (`RustLib`), so they do not need to compile it.
      - name: Tests
        run: flutter test

  # The `mobile` job above neither compiles the Rust nor runs Gradle; this one proves the Android APK comes out (NDK, cargokit and the
  # `warden-mobile-bridge` bridge). arm64 only (one ABI instead of four) and signed with the debug key of `build.gradle.kts`:
  # it is a build check, not a release.
  android:
    name: Android (arm64 APK)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Cargokit (Gradle) uses `rustup` to install the Android target and compile `warden-mobile-bridge`.
      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Keep the APK
        uses: actions/upload-artifact@v7
        with:
          name: warden-android-arm64
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
