name: CI

# A suíte completa roda aqui, não na máquina de desenvolvimento (Sessão 223): na máquina fica só o `cargo check`
# e um teste pontual. Roda em todo push na main, em PR e pelo botão "Run workflow".
# Um commit que só mexe na documentação não dispara a rodada, e cada job só roda se a sua área mudou (job `changes`):
#   rust       <- crates/**, desktop/src-tauri/**, Cargo.toml, Cargo.lock
#   web        <- web/**
#   desktop    <- desktop/**
#   extension  <- extension/**
#   mobile     <- mobile/** e crates/warden-mobile-bridge/** (o Dart gerado pelo flutter_rust_bridge sai desse crate)
#   android    <- o mesmo filtro do mobile (compila o APK arm64, o que o `mobile` não faz)
# Mexer no próprio ci.yml roda tudo, e o botão "Run workflow" também.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - 'project/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

# Um push novo na mesma branch cancela a rodada que ainda estiver em andamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental só ajuda quem recompila a mesma árvore; no CI ele só engorda o cache.
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Áreas alteradas
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.out.outputs.rust }}
      mobile: ${{ steps.out.outputs.mobile }}
      # Lista JSON dos frontends alterados, usada como matriz (`[]` = nenhum).
      frontends: ${{ steps.out.outputs.frontends }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filtro por pasta
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'desktop/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            desktop:
              - 'desktop/**'
              - '.github/workflows/ci.yml'
            extension:
              - 'extension/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - 'crates/warden-mobile-bridge/**'
              - '.github/workflows/ci.yml'

      - name: Resultado
        id: out
        env:
          EVENT: ${{ github.event_name }}
          MATCHED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MATCHED='["rust","web","desktop","extension","mobile"]'
          fi
          echo "rust=$(jq -r 'index("rust") != null' <<<"$MATCHED")" >> "$GITHUB_OUTPUT"
          echo "mobile=$(jq -r 'index("mobile") != null' <<<"$MATCHED")" >> "$GITHUB_OUTPUT"
          echo "frontends=$(jq -c '[.[] | select(IN("web","desktop","extension"))]' <<<"$MATCHED")" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (clippy e testes)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # 24.04 e não 22.04: o ONNX Runtime pronto que o `ort` baixa pede glibc 2.38+ (o 22.04 tem a 2.35 e o link falha).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # O `desktop/src-tauri` é membro do workspace, então o Linux precisa das mesmas libs do build.yml.
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            patchelf \
            libudev-dev \
            libasound2-dev \
            pkg-config

      # Sem `cargo fmt --check`: o repo não segue o rustfmt.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Testes
        # Sem parar no primeiro crate que falha, para a rodada mostrar todas as falhas de uma vez. A saída vai também para um arquivo, para o
        # passo seguinte listar no resumo do run o que falhou (P164 b); `pipefail` (do `shell: bash`) mantém o status do `cargo test`.
        shell: bash
        run: cargo test --workspace --no-fail-fast 2>&1 | tee cargo-test.log

      # Só LISTA: o nome de cada teste que falhou e a linha do pânico, para o padrão (o mesmo teste de novo, ou testes diferentes) aparecer
      # sem abrir o log. Nada é religado nem escondido: o job continua vermelho (regras 2 e 3 do `project/AUTOMACAO.md`).
      - name: Testes que falharam
        if: failure()
        shell: bash
        run: |
          {
            echo "## Testes que falharam"
            echo
            echo '```'
            grep -E '^test .* FAILED$|panicked at ' cargo-test.log | sort -u | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontends:
    name: Frontend (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.frontends != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.frontends) }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          # A mesma da máquina de desenvolvimento: os testes importam `.ts` direto e `node --test tests/` recebe uma
          # pasta, e o Node 24 não aceita pasta ali.
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Flutter analyze e testes)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A mesma versão da máquina de desenvolvimento.
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Avisos de estilo (info) não derrubam a rodada; erros e warnings sim.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Os testes não carregam a biblioteca Rust (`RustLib`), então não precisam compilá-la.
      - name: Testes
        run: flutter test

  # O `mobile` acima não compila o Rust nem roda o Gradle; este prova que o APK Android sai (NDK, cargokit e a ponte
  # `warden-mobile-bridge`). Só arm64 (uma ABI em vez de quatro) e assinado com a chave de debug do `build.gradle.kts`:
  # é uma checagem de compilação, não um release.
  android:
    name: Android (APK arm64)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # O cargokit (Gradle) usa o `rustup` para instalar o alvo Android e compilar `warden-mobile-bridge`.
      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Guarda o APK
        uses: actions/upload-artifact@v7
        with:
          name: warden-android-arm64
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
