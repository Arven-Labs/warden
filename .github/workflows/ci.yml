name: CI

# A suíte completa roda aqui, não na máquina de desenvolvimento (Sessão 223): na máquina fica só o `cargo check`
# e um teste pontual. Roda em todo push na main, em PR e pelo botão "Run workflow".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo na mesma branch cancela a rodada que ainda estiver em andamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental só ajuda quem recompila a mesma árvore; no CI ele só engorda o cache.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (clippy e testes)
    # 24.04 e não 22.04: o ONNX Runtime pronto que o `ort` baixa pede glibc 2.38+ (o 22.04 tem a 2.35 e o link falha).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # O `desktop/src-tauri` é membro do workspace, então o Linux precisa das mesmas libs do build.yml.
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            patchelf \
            libudev-dev \
            libasound2-dev \
            pkg-config

      # Sem `cargo fmt --check`: o repo não segue o rustfmt.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Testes
        # Sem parar no primeiro crate que falha, para a rodada mostrar todas as falhas de uma vez.
        run: cargo test --workspace --no-fail-fast

  frontends:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [web, desktop, extension]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          # A mesma da máquina de desenvolvimento: os testes importam `.ts` direto e `node --test tests/` recebe uma
          # pasta, e o Node 24 não aceita pasta ali.
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Flutter analyze e testes)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A mesma versão da máquina de desenvolvimento.
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Avisos de estilo (info) não derrubam a rodada; erros e warnings sim.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Os testes não carregam a biblioteca Rust (`RustLib`), então não precisam compilá-la.
      - name: Testes
        run: flutter test
