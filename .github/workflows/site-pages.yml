name: Docs site (GitHub Pages)

# Publishes `site/` (the static export) to GitHub Pages on every push to main that touches it.
# The site lives under /warden there, so the build gets SITE_BASE_PATH; a custom domain would drop it.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_BASE_PATH: /warden
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/out

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
