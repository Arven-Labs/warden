name: Script with a real model

# `real_model.rs` (P156): what only passed with a fake model, now with a real model (skills, tasks, two-level delegation).
# It calls a PAID API, so it only runs by button, never on a schedule:
#   gh workflow run real-model.yml                       # the default model
#   gh workflow run real-model.yml -f model=<id>         # another OpenRouter model
# The key is OpenRouter's, in a repository secret (only Fabio has it; it never goes through Claude):
#   ! gh secret set WARDEN_EVAL_KEY < ~/Documents/api.txt
# Without the secret the first step fails saying so, before compiling. Each test's result goes in the run summary. A model is not
# deterministic: a red test says what the model did instead, and the printed events must be read before blaming the code.
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model id on OpenRouter'
        required: true
        default: 'deepseek/deepseek-v4.1-flash'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  real-model:
    name: Script with the model ${{ inputs.model }}
    # 24.04: the ready-made ONNX Runtime of `ort` needs glibc 2.38+ (see ci.yml).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Does the key exist?
        env:
          KEY: ${{ secrets.WARDEN_EVAL_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The secret WARDEN_EVAL_KEY does not exist in this repository. Create it once, with the OpenRouter key file: ! gh secret set WARDEN_EVAL_KEY < ~/Documents/api.txt"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # `--test-threads=1`: the tests share the same model and the account; the command is the one in the header of `real_model.rs`.
      - name: Script
        shell: bash
        env:
          WARDEN_EVAL_PROVIDER: openai_compatible
          WARDEN_EVAL_BASE_URL: https://openrouter.ai/api/v1
          WARDEN_EVAL_MODEL: ${{ inputs.model }}
          WARDEN_EVAL_KEY: ${{ secrets.WARDEN_EVAL_KEY }}
        run: |
          set +e
          cargo test -p warden-bootstrap --test real_model -- --ignored --nocapture --test-threads=1 2>&1 | tee real-model.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Script with a real model: ${WARDEN_EVAL_MODEL}"
            echo
            echo '```'
            grep -E '^test .* \.\.\. ' real-model.log || echo "no test ran"
            echo '```'
            if [ "$status" -ne 0 ]; then
              echo
              echo "<details><summary>What the model did (end of the log)</summary>"
              echo
              echo '```'
              tail -n 120 real-model.log
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
