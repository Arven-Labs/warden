name: Usage guide (does the .deb install?)

# Checks path A of GUIA-DE-USO.md: the `.deb` of the latest release installs on a clean Ubuntu 24.04 (the declared
# dependencies are enough) and the app opens on a virtual screen. Path B (the hub image and the guide's `config.toml`) is checked
# by `image.yml`, in `scripts/image-smoke.sh`. No manual testing: it runs when the guide or this script change, or by hand:
#   gh workflow run guide-check.yml
on:
  push:
    branches: [main]
    paths:
      - 'GUIA-DE-USO.md'
      - 'scripts/deb-check.sh'
      - '.github/workflows/guide-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: .deb on a clean Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the .deb of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern '*_amd64.deb' --dir deb

      - name: Install and open
        run: bash scripts/deb-check.sh deb/*_amd64.deb
