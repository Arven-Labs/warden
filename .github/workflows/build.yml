name: Build

# Dispara apenas quando uma tag de versão é criada (ex: v0.1.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04: o ONNX Runtime pronto do `ort` pede glibc 2.38+ (ver ci.yml), então o .deb também pede.
          - os: ubuntu-24.04
            artifact: '*.deb'
          - os: windows-latest
            artifact: '*.msi'
          - os: macos-latest
            artifact: '*.dmg'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        # O `desktop/src-tauri` é membro do workspace da raiz, então o `target/` (o que se guarda) fica na raiz.
        uses: Swatinem/rust-cache@v2

      # Dependências nativas do Linux que o Tauri, o keyring e o áudio (cpal) precisam
      - name: Linux deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            patchelf \
            libudev-dev \
            libasound2-dev \
            pkg-config

      - name: npm install
        working-directory: desktop
        run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Warden ${{ github.ref_name }}
          releaseDraft: true
          includeDebug: false

  # O APK do Android no mesmo release (rascunho) dos instaladores, para o GUIA-DE-USO.md poder mandar baixar em vez de
  # construir. Assinado com a chave de DEBUG do `build.gradle.kts`, que muda a cada runner: instala (com "fontes
  # desconhecidas" permitidas), mas uma versão nova só entra por cima depois de desinstalar a antiga. Uma chave fixa
  # (segredo do repositório) é decisão pendente (P156). `needs: build` porque o `tauri-action` é quem cria o rascunho.
  android:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: APK
        run: flutter build apk --release --target-platform android-arm64

      # `gh release upload` por tag não enxerga um rascunho; pelo id, a API envia o arquivo ao rascunho.
      - name: Anexa o APK ao release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        working-directory: .
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)"
          [ -n "$id" ] || { echo "não achei o release da tag $TAG" >&2; exit 1; }
          name="Warden_${TAG#v}_android-arm64.apk"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @mobile/build/app/outputs/flutter-apk/app-release.apk \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$name" >/dev/null
          echo "anexado: $name"

  # As notas propostas, dos commits desde a tag anterior, no corpo do rascunho (P164 a). Depois dos instaladores e do APK, que são quem cria e
  # mexe no rascunho; roda mesmo se uma plataforma falhar, porque as notas não dependem dela. Nunca publica: o Fabio revisa e publica.
  notes:
    needs: [build, android]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/release-notes.yml
    with:
      tag: ${{ github.ref_name }}
      apply: true
