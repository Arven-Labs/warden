name: Build

# Triggers only when a version tag is created (e.g. v0.1.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04: the ready-made ONNX Runtime of `ort` needs glibc 2.38+ (see ci.yml), so the .deb needs it too.
          - os: ubuntu-24.04
            artifact: '*.deb'
          - os: windows-latest
            artifact: '*.msi'
          - os: macos-latest
            artifact: '*.dmg'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        # `desktop/src-tauri` is a member of the root workspace, so the `target/` (what gets cached) sits at the root.
        uses: Swatinem/rust-cache@v2

      # Native Linux dependencies that Tauri, the keyring and the audio (cpal) need
      - name: Linux deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            patchelf \
            libudev-dev \
            libasound2-dev \
            pkg-config

      - name: npm install
        working-directory: desktop
        run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Warden ${{ github.ref_name }}
          releaseDraft: true
          includeDebug: false

  # The Android APK in the same (draft) release as the installers, so GUIA-DE-USO.md can tell people to download it instead of
  # building it. Signed with the DEBUG key of `build.gradle.kts`, which changes on every runner: it installs (with "unknown
  # sources" allowed), but a new version only goes over the old one after uninstalling it. A fixed key
  # (a repository secret) is a pending decision (P156). `needs: build` because `tauri-action` is what creates the draft.
  android:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: APK
        run: flutter build apk --release --target-platform android-arm64

      # `gh release upload` by tag does not see a draft; by id, the API sends the file to the draft.
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        working-directory: .
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)"
          [ -n "$id" ] || { echo "could not find the release of tag $TAG" >&2; exit 1; }
          name="Warden_${TAG#v}_android-arm64.apk"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @mobile/build/app/outputs/flutter-apk/app-release.apk \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$name" >/dev/null
          echo "attached: $name"

  # The proposed notes, from the commits since the previous tag, in the body of the draft (P164 a). After the installers and the APK, which are what create and
  # touch the draft; it runs even if a platform fails, because the notes do not depend on it. It never publishes: Fabio reviews and publishes.
  notes:
    needs: [build, android]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/release-notes.yml
    with:
      tag: ${{ github.ref_name }}
      apply: true
