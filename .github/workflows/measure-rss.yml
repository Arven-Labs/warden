name: Measure RSS

# Repeats Session 222's memory measurement (HOSPEDAGEM.md section K) with the current release binary: idle hub without and with the search
# models, and the 1st turn with vaults of 50 to 1000 short notes and 300 long ones (P145, P146). It runs every Monday morning and, when
# wanted, by hand:
#   gh workflow run measure-rss.yml
# The table goes in the run summary, along with the comparison with `scripts/rss-baseline.json` (P162): if any scenario's RSS grows more than
# 10% (at least 5 MB) the job goes red and opens, or comments on, an issue. RSS varies 1 to 2% between runs of the same code, so
# 10% is a real change. When the change is deliberate, the baseline is updated in a separate commit (header of
# `scripts/compare-rss.py`). The runner has 4 cores and the final RSS does not depend on them (section K.3).
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Fraction that RSS may grow (0.10 = 10%). Only changed to prove the alert, e.g. -1 with floor_mb 0'
        default: '0.10'
      floor_mb:
        description: 'Minimum growth in MB to count'
        default: '5'

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  measure:
    name: Hub RSS in release
    # 24.04: the ready-made ONNX Runtime of `ort` needs glibc 2.38+ (see ci.yml).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # The script links each scenario's models folder to this one, so the two models download only once.
      - name: Models cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/warden/models
          key: warden-models-${{ hashFiles('crates/warden-core/Cargo.toml') }}

      - name: Release build
        run: cargo build --release -p warden-server

      - name: Measure
        run: |
          python3 scripts/measure-rss.py --json rss.json | tee rss.md
          {
            echo "## warden-server RSS in release"
            echo
            cat rss.md
          } >> "$GITHUB_STEP_SUMMARY"

      # Exits with 1 when any scenario went over the limit; the issue step runs anyway (`if: always()`) and only acts if `regressed`.
      - name: Compare with the baseline
        id: compare
        env:
          LIMIT: ${{ inputs.limit || '0.10' }}
          FLOOR_MB: ${{ inputs.floor_mb || '5' }}
        run: |
          set +e
          python3 scripts/compare-rss.py scripts/rss-baseline.json rss.json --limit "$LIMIT" --floor-mb "$FLOOR_MB" | tee compare.md
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Comparison with scripts/rss-baseline.json"
            echo
            cat compare.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        shell: bash

      # Best effort: if the issue cannot be opened, the red job and the summary already say what went over.
      - name: Open or comment on the issue
        if: always() && steps.compare.outputs.regressed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create rss --description "Hub RSS went over the limit" --color d93f0b --force
          title="Hub RSS went over the limit"
          body="$(printf 'Run: %s/%s/actions/runs/%s\n\n%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(cat compare.md)")"
          open="$(gh issue list --label rss --state open --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --label rss --body "$body"
          fi
