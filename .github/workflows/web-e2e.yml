name: Web E2E

# The browser tests of the web page (`web/e2e`): a real hub with made-up data and a headless Chromium. Before
# this file they only ran by hand (Session 261). They also photograph the screens (`snap` in `web/e2e/harness.mjs`) and CI always
# uploads the photos as an artifact, for someone to look at each one (`project/AUTOMACAO.md`). It stays out of `ci.yml` because it compiles the
# hub and installs the browser, which would lengthen every push.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/web-e2e.yml'
  workflow_dispatch:

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  e2e:
    name: Browser against a real hub
    # 24.04: the ready-made ONNX Runtime of `ort` needs glibc 2.38+ (see ci.yml).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      # The hub embeds `web/dist`.
      - name: Build the page
        working-directory: web
        run: npm run build

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build the hub
        run: cargo build -p warden-server --bin warden-server

      - name: Chromium
        working-directory: web
        run: npx playwright-core install --with-deps chromium

      # A test that hangs fails by itself in 4 minutes and the whole step in 25, instead of the run sitting still until the job limit
      # with no log (the first run, in Session 261, sat here for 42 minutes saying nothing).
      - name: Browser tests
        working-directory: web
        timeout-minutes: 25
        env:
          WARDEN_E2E_SCREENS: ${{ github.workspace }}/e2e-screens
        run: node --test --test-reporter=tap --test-timeout=240000 e2e/*.test.mjs

      # Always, not only on failure: the photos are meant to be looked at even when everything is green.
      - name: Screen photos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-screens
          path: e2e-screens
          retention-days: 14
          if-no-files-found: ignore
