name: Imagem do hub

# Constrói a imagem (Dockerfile) e roda o teste de fumaça com a raiz só de leitura (P143 e). Não publica nada.
# O build de release é pesado, então não roda a cada push de código: só quando a própria imagem muda, ou à mão
# ("Run workflow"). Quem muda o hub e quer ver a imagem de pé dispara à mão.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/image-smoke.sh'
      - 'scripts/fake-openai.py'
      - 'scripts/orchestrator-smoke.sh'
      - 'crates/warden-orchestrator/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:
  # Chamado por `image-publish.yml` (a publicação numa tag `v*`), que só publica se esta fumaça passar.
  workflow_call:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Imagem e teste de fumaça
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: warden-server:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Teste de fumaça (raiz só de leitura)
        run: bash scripts/image-smoke.sh warden-server:smoke

      # O orquestrador (P138, fase 4) contra Docker de verdade, com a imagem que acabou de passar na fumaça: provisionar,
      # suspender, retomar, reciclar e apagar uma instância.
      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build do orquestrador
        run: cargo build --release --locked -p warden-orchestrator

      - name: Teste de fumaça do orquestrador
        run: bash scripts/orchestrator-smoke.sh warden-server:smoke target/release/warden-orchestrator
