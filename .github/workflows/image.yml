name: Hub image

# Builds the image (Dockerfile) and runs the smoke test with the read-only root (P143 e). It publishes nothing.
# The release build is heavy, so it does not run on every code push: only when the image itself changes, or by hand
# ("Run workflow"). Whoever changes the hub and wants to see the image up triggers it by hand.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/image-smoke.sh'
      - 'GUIA-DE-USO.md'
      - 'scripts/fake-openai.py'
      - 'scripts/orchestrator-smoke.sh'
      - 'crates/warden-orchestrator/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:
  # Called by `image-publish.yml` (the publication on a `v*` tag), which only publishes if this smoke test passes.
  workflow_call:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Image and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: warden-server:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (read-only root)
        run: bash scripts/image-smoke.sh warden-server:smoke

      # The orchestrator (P138, phase 4) against real Docker, with the image that just passed the smoke test: provision,
      # suspend, resume, recycle and delete an instance.
      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build the orchestrator
        run: cargo build --release --locked -p warden-orchestrator

      - name: Orchestrator smoke test
        run: bash scripts/orchestrator-smoke.sh warden-server:smoke target/release/warden-orchestrator
