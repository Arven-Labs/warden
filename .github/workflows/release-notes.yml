name: Release notes

# Builds a release's notes from the commits between the previous tag and this one (`scripts/release-notes.py`, P164 a) and, with `apply`, writes them into the
# body of the DRAFT release, for Fabio to review and publish. It never publishes and never touches an already published release (it refuses).
# It runs by itself at the end of `build.yml`, after the draft and the installers exist, and by hand to see what would come out:
#   gh workflow run release-notes.yml -f tag=v0.1.1              # only the run summary
#   gh workflow run release-notes.yml -f tag=v0.1.2 -f apply=true
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      apply:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag (e.g. v0.1.2)'
        required: true
      apply:
        description: 'Write into the draft body (a published release is refused)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  notes:
    name: Notes of ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole history and the tags: the notes come from the `git log` between two tags.
          fetch-depth: 0

      - name: Build the notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release-notes.py "$TAG" | tee notes.md
          {
            echo "## Proposed notes for $TAG"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      # By id, like the APK step of `build.yml`: `gh release edit` by tag does not see a draft.
      - name: Write into the draft
        if: inputs.apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | [.id, .draft] | @tsv" | head -n 1)"
          [ -n "$release" ] || { echo "::error::could not find the release of tag $TAG" >&2; exit 1; }
          id="${release%%$'\t'*}"
          draft="${release##*$'\t'}"
          if [ "$draft" != "true" ]; then
            echo "::error::the release $TAG is already published: its notes are not replaced by an automatic step" >&2
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F body=@notes.md --silent
          echo "Notes written into the draft $TAG (id $id). Review and publish." >> "$GITHUB_STEP_SUMMARY"
