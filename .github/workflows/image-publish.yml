name: Publish the hub image

# When a version tag is created (v0.1.0), builds the image, runs the smoke test with the read-only root (`image.yml`) and, only if it
# passes, publishes to the GitHub Container Registry:  ghcr.io/arven-labs/warden-server
#   v0.1.0 -> :0.1.0, :0.1 and :latest   (a pre-release such as v0.2.0-rc.1 gets no :latest)
# The image is public, like the repository. linux/amd64 only.
#
#   docker run --read-only --tmpfs /tmp -v warden-data:/data -p 7420:7420 \
#     -e WARDEN_SERVER_AUTH_KEY="$(openssl rand -hex 32)" -e GEMINI_API_KEY=... ghcr.io/arven-labs/warden-server:latest
#
# The tag also triggers `build.yml` (the desktop installers); the two are independent.
on:
  push:
    tags:
      - 'v*'
  # By hand it only runs the smoke test: the `publish` below requires a tag, so the button is for checking the file without publishing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Image and smoke test
    uses: ./.github/workflows/image.yml

  publish:
    name: Publish to GHCR
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI names and labels, including `org.opencontainers.image.source`, which ties the package to this repository (and makes it
      # inherit its public visibility). GHCR requires the name in lowercase.
      - name: Names and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/arven-labs/warden-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The expensive layer (`cargo build`) comes from the cache the smoke test just wrote.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
