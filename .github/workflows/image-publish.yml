name: Publicar a imagem do hub

# Ao criar uma tag de versão (v0.1.0), constrói a imagem, roda a fumaça com a raiz só de leitura (`image.yml`) e, só se ela
# passar, publica no GitHub Container Registry:  ghcr.io/arven-labs/warden-server
#   v0.1.0 -> :0.1.0, :0.1 e :latest   (um pré-lançamento como v0.2.0-rc.1 não leva :latest)
# A imagem é pública, como o repositório. Só linux/amd64.
#
#   docker run --read-only --tmpfs /tmp -v warden-data:/data -p 7420:7420 \
#     -e WARDEN_SERVER_AUTH_KEY="$(openssl rand -hex 32)" -e GEMINI_API_KEY=... ghcr.io/arven-labs/warden-server:latest
#
# A tag também dispara o `build.yml` (instaladores do desktop); os dois são independentes.
on:
  push:
    tags:
      - 'v*'
  # À mão só roda a fumaça: o `publish` abaixo exige uma tag, então o botão serve para conferir o arquivo sem publicar.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Imagem e teste de fumaça
    uses: ./.github/workflows/image.yml

  publish:
    name: Publicar no GHCR
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nomes e rótulos OCI, inclusive `org.opencontainers.image.source`, que liga o pacote a este repositório (e o faz
      # herdar a visibilidade pública dele). O GHCR exige o nome em minúsculas.
      - name: Nomes e rótulos
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/arven-labs/warden-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # A camada cara (o `cargo build`) vem do cache que a fumaça acabou de gravar.
      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
